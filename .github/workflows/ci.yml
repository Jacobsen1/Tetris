name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build (byte-compile sources)
        run: python -m compileall -q main.py game.py Figures.py Fig.py settings.py

      - name: Run UI tests
        run: python -m pytest -v --junitxml=test-results/junit.xml

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: test-results/
          retention-days: 14
